# ComboSciPlex extension runs. Data files and drug-to-target mapping must exist.

study_name: 20260603_combosciplex_0602
output_root: outputs
base_config: configs/combosciplex.yaml
overrides:
  model.spectral_propagation: true
  model.propagation_channels: 8
  model.propagation_scale: 1.0
  flow.sigma: 0.2
  flow.ot_coupling: true
  flow.mmd_weight: 0.0
  flow.delta_corr_weight: 0.03
  training.batch_size: 512
  training.max_steps: 200000
  training.eval_every_steps: 5000
  training.learning_rate: 0.0003
  training.eta_min: 0.000001
  training.warmup_steps: 2000
  inference.n_control_cells: 128
  inference.ode_steps: 30
  inference.n_samples: 10
  inference.de_top_k: 20

experiments:
  - name: combosciplex_full
    gpu: 0
    seed: 42

  - name: combosciplex_no_spectral_propagation
    gpu: 1
    seed: 42
    overrides:
      model.spectral_propagation: false

  - name: combosciplex_graph_none
    gpu: 2
    seed: 42
    overrides:
      model.graph_mode: none

  - name: combosciplex_no_delta_corr
    gpu: 3
    seed: 42
    overrides:
      flow.delta_corr_weight: 0.0
