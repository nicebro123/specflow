# Drug-to-target map for the local ComboSciPlex extension.
#
# ComboSciPlex conditions are drug labels (for example
# "Panobinostat+Crizotinib"), while SpecFlow needs a gene-aligned perturbation
# mask. Keep this file small and versioned so Combo runs do not depend on an
# untracked data/ sidecar.
#
# Targets are restricted to symbols present in data/combosciplex.h5ad var_names.
