# Norman holdout (scDFM "unseen") single-run config.
# Mirrors configs/norman.yaml (the 0602 model) so a standalone holdout run uses
# the SAME architecture / training budget / gene space as the additive main
# results -- only the split and setting differ.
#
# Prerequisite: generate the split file once:
#   python scripts/build_holdout_split.py --h5ad data/norman.h5ad \
#     --output data/splits/norman_holdout.pkl

data:
  dataset: norman
  h5ad_path: data/norman.h5ad
  condition_key: condition
  control_labels: [ctrl, control]
  separator: "+"
  split_path: data/splits/norman_holdout.pkl   # scDFM unseen split (12 held-out genes/fold)
  split_fold: 1
  preprocess: true            # HVG 5000 + perturbation genes, same as additive / scDFM
  n_top_genes: 5000
  preprocess_cache: true
  setting: holdout
  val_from_train_fraction: 0.05
  samples_per_condition: 256

graph:
  go:
    annotation_file: data/gene_ontology/go_annotations.gaf
    namespace: biological_process
    k_neighbors: 20

spectral:
  static: true            # S3: 静态谱位置编码

model:
  spectral_propagation: true   # 创新1: 谱扰动传播算子
  propagation_channels: 8

flow:
  sigma: 0.2
  ot_coupling: true       # 创新3: OT 耦合 control->perturbed
  mmd_weight: 0.0
  delta_corr_weight: 0.03 # 直接对齐 pearson_delta 的扰动残差方向

training:
  batch_size: 512
  max_steps: 200000
  eval_every_steps: 5000
  learning_rate: 0.0003
  eta_min: 0.000001
  warmup_steps: 2000

inference:
  n_control_cells: 128
  ode_steps: 30
  n_samples: 10
  de_top_k: 20

output:
  output_dir: outputs/norman_holdout
